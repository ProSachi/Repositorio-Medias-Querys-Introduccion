<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Vinculación del archivo de estilos independiente -->
    <link rel="stylesheet" href="style.css">
    <!-- Iconos opcionales para mayor elegancia -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <main class="login-container">
        <div class="login-card">
            
            <!-- Cabecera del formulario -->
            <header class="login-header">
                <div class="logo">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2>Bienvenido</h2>
                <p>Ingresa tus credenciales para acceder</p>
            </header>

            <!-- Formulario de inicio de sesión -->
            <form class="login-form">
                
                <!-- Campo de Usuario / Email -->
                <div class="form-group">
                    <label for="username">Correo electrónico o usuario</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="email" id="username" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>

                <!-- Campo de Contraseña -->
                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Contraseña</label>
                        <a href="#" class="forgot-link">¿La olvidaste?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Opciones adicionales -->
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember">
                        <span class="custom-checkbox"></span>
                        Recordarme en este equipo
                    </label>
                </div>

                <!-- Botón de Envío -->
                <button type="submit" class="btn-submit">
                    Iniciar Sesión
                </button>
            </form>

            <!-- Pie de la tarjeta -->
            <footer class="login-footer">
                <p>¿No tienes una cuenta? <a href="#" class="register-link">Regístrate aquí</a></p>
            </footer>

        </div>
    </main>

</body>
</html>
