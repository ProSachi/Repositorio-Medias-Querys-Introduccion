<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia tu proceso de inscripción en CESDE.">
    <title>Inscripcion | CESDE</title>
    <link rel="stylesheet" href="css/base.css">
</head>
<body>
    <header class="header">
        <div class="container header__content">
            <a class="logo" href="index.html">CESDE</a>
            <nav class="nav" aria-label="Navegacion principal">
                <a href="index.html#programas">Programas</a>
                <a href="index.html#beneficios">Beneficios</a>
                <a href="register.html" aria-current="page">Inscripcion</a>
            </nav>
        </div>
    </header>

    <main class="registration">
        <div class="container registration__layout">
            <section class="registration__intro" aria-labelledby="registration-title">
                <p class="eyebrow">Tu proximo paso</p>
                <h1 id="registration-title">Comienza tu inscripcion</h1>
                <p>Cuéntanos un poco sobre ti y el programa que te interesa.</p>
                <a class="registration__back" href="index.html">Volver a CESDE</a>
            </section>

            <form class="registration__form" id="registration-form">
                <h2>Tus datos</h2>
                <div class="registration__fields">
                    <div class="form-field">
                        <label for="full-name">Nombre completo</label>
                        <input id="full-name" name="fullName" type="text" autocomplete="name" required>
                    </div>
                    <div class="form-field">
                        <label for="document-type">Tipo de documento</label>
                        <select id="document-type" name="documentType" required>
                            <option value="" selected disabled>Selecciona una opcion</option>
                            <option value="cc">Cedula de ciudadania</option>
                            <option value="ce">Cedula de extranjeria</option>
                            <option value="ti">Tarjeta de identidad</option>
                            <option value="passport">Pasaporte</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="document-number">Numero de documento</label>
                        <input id="document-number" name="documentNumber" type="text" inputmode="numeric" autocomplete="off" required>
                    </div>
                    <div class="form-field">
                        <label for="email">Correo electronico</label>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="form-field">
                        <label for="phone">Telefono celular</label>
                        <input id="phone" name="phone" type="tel" autocomplete="tel" required>
                    </div>
                    <div class="form-field">
                        <label for="program">Programa de interes</label>
                        <select id="program" name="program" required>
                            <option value="" selected disabled>Selecciona un area</option>
                            <option value="technology">Tecnologia y software</option>
                            <option value="health">Salud y bienestar</option>
                            <option value="business">Negocios y servicios</option>
                        </select>
                    </div>
                </div>

                <label class="form-consent" for="consent">
                    <input id="consent" name="consent" type="checkbox" required>
                    <span>Acepto que CESDE se comunique conmigo para brindarme informacion sobre su oferta educativa.</span>
                </label>
                <button class="btn btn--primary registration__submit" type="submit">Enviar mis datos</button>
                <p class="registration__status" id="form-status" role="status" aria-live="polite"></p>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer__content">
            <p>© 2026 CESDE. Educacion para el trabajo con impacto real.</p>
        </div>
    </footer>
    <script>
        document.querySelector("#registration-form").addEventListener("submit", (event) => {
            event.preventDefault();
            document.querySelector("#form-status").textContent =
                "Formulario validado. Para enviar tus datos, esta pagina necesita conectarse a un servicio de inscripcion.";
        });
    </script>
</body>
</html>
